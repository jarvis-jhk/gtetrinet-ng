name: Build and test
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev xvfb xauth desktop-file-utils
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
      - run: xvfb-run -a ./build/gtetrinet-ng --window --demo 8 --frames 600 --screenshot demo.bmp
        env:
          ASAN_OPTIONS: detect_leaks=0
          GTN_NO_REPORT: "1"
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: desktop-file-validate tools/linux/Install-GTetrinet-NG.desktop
      - run: bash -n tools/linux/install.sh tools/linux/gtetrinet-ng.sh tools/linux/bundle-linux.sh
  interop:
    # our client against TetriNET servers we did not write: tetrinetx and tetrinet-server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libadns1-dev tetrinet-server
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - run: cmake --build build --parallel 2 --target test_interop test_online gtetrinet-ng-server
      - run: tests/interop.sh build build
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-SDL2
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/gtetrinet-ng.exe --window --demo 8 --frames 600 --screenshot demo.bmp
      - run: printf 'int main(void){return 3;}\n' > build/exit3.c && gcc build/exit3.c -o build/exit3.exe
      - run: tests/test_play_launcher.ps1 -Fake build/exit3.exe
        shell: powershell
