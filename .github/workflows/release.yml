name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev xvfb xauth python3-pil desktop-file-utils zsync
      - run: |
          tag='${{ github.ref_name }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGTN_VERSION="${tag#v}" -DGTN_FAULT_REPORTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          GTN_NO_REPORT=1 xvfb-run -a ./build/gtetrinet-ng --window --demo 8 --frames 600 --screenshot demo.bmp
          mkdir -p dist/gtetrinet-ng/tools/linux dist/gtetrinet-ng/artwork
          GTN_NO_REPORT=1 xvfb-run -a ./build/gtetrinet-ng --window --demo 8 --frames 600 --art dist/gtetrinet-ng/artwork
          python3 tools/linux/convert-artwork.py dist/gtetrinet-ng/artwork
          cmake --install build --prefix "$PWD/dist/gtetrinet-ng"
          bash tools/linux/bundle-linux.sh dist/gtetrinet-ng
          cp tools/linux/*.py dist/gtetrinet-ng/tools/linux/
          cp tools/linux/gtetrinet-ng.sh dist/gtetrinet-ng/
          cp CHANGELOG.md COPYING README.md THIRD_PARTY.md dist/gtetrinet-ng/
          cp /usr/share/doc/libsdl2-2.0-0/copyright dist/gtetrinet-ng/SDL2-license.txt
          if [ -f dist/gtetrinet-ng/lib/libsamplerate.so.0 ]; then
            cp /usr/share/doc/libsamplerate0/copyright dist/gtetrinet-ng/samplerate-license.txt
          fi
          echo "$tag" > dist/gtetrinet-ng/VERSION
          tar -C dist -czf dist/gtetrinet-ng-linux-x86_64.tar.gz gtetrinet-ng
          sed "s/@TAG@/$tag/g" tools/linux/install.sh > dist/install.sh
          cp tools/linux/launcher.py dist/launcher.py
          sed "s/@TAG@/$tag/g" tools/linux/Install-GTetrinet-NG.desktop > dist/Install-GTetrinet-NG.desktop
          desktop-file-validate dist/Install-GTetrinet-NG.desktop
          # Pinned AppImage tooling; the static type2 runtime needs no libfuse2 (SteamOS has none).
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o appimage-runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          printf '%s  %s\n' ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 appimagetool 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d appimage-runtime | sha256sum -c
          chmod +x appimagetool
          bash tools/linux/build-appimage.sh dist/gtetrinet-ng dist/gtetrinet-ng-x86_64.AppImage "$PWD/appimagetool" "$PWD/appimage-runtime"
          test -s dist/gtetrinet-ng-x86_64.AppImage.zsync
          ./dist/gtetrinet-ng-x86_64.AppImage --appimage-extract-and-run --version | grep -qx "gtetrinet-ng ${tag#v}"
          GTN_NO_REPORT=1 xvfb-run -a ./dist/gtetrinet-ng-x86_64.AppImage --appimage-extract-and-run --window --demo 8 --frames 600 --screenshot appimage-smoke.bmp
          test -s appimage-smoke.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/Install-GTetrinet-NG.desktop
            dist/install.sh
            dist/launcher.py
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-SDL2 zip
      - run: |
          tag='${{ github.ref_name }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGTN_VERSION="${tag#v}" -DGTN_FAULT_REPORTS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          GTN_NO_REPORT=1 ./build/gtetrinet-ng.exe --window --demo 8 --frames 600 --screenshot demo.bmp
          mkdir -p dist/gtetrinet-ng
          cp build/gtetrinet-ng.exe build/gtetrinet-ng-server.exe dist/gtetrinet-ng/
          # SDL and its compiler runtimes are redistributed with their source/licence notices.
          cp /ucrt64/bin/SDL2.dll /ucrt64/bin/libgcc_s_seh-1.dll /ucrt64/bin/libwinpthread-1.dll /ucrt64/bin/libiconv-2.dll /ucrt64/bin/libcharset-1.dll dist/gtetrinet-ng/
          cp tools/windows/* CHANGELOG.md COPYING README.md THIRD_PARTY.md dist/gtetrinet-ng/
          cp -r /ucrt64/share/licenses/SDL2 dist/gtetrinet-ng/SDL2-license
          cp -r /ucrt64/share/licenses/libiconv dist/gtetrinet-ng/libiconv-license
          iconv_version=$(pacman -Q mingw-w64-ucrt-x86_64-libiconv | awk '{print $2}')
          curl -fsSL --max-time 120 "https://mirror.msys2.org/mingw/sources/mingw-w64-libiconv-$iconv_version.src.tar.zst" -o dist/gtetrinet-ng/libiconv-source.tar.zst
          # Exclude the toolchain DLL directory so missing runtime dependencies fail here.
          GTN_NO_REPORT=1 PATH=/usr/bin:/c/Windows/System32:/c/Windows ./dist/gtetrinet-ng/gtetrinet-ng.exe --window --demo 8 --frames 600 --screenshot package-smoke.bmp
          test -s package-smoke.bmp
          echo "$tag" > dist/gtetrinet-ng/VERSION
          cd dist && zip -r gtetrinet-ng-windows-x86_64.zip gtetrinet-ng
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: dist
      - run: |
          cd dist
          sha256sum *.tar.gz *.AppImage *.zip Install-GTetrinet-NG.desktop install.sh launcher.py > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --title "gtetrinet-ng ${GITHUB_REF_NAME} — preview" --notes-file ../CHANGELOG.md *.tar.gz *.AppImage *.AppImage.zsync *.zip Install-GTetrinet-NG.desktop install.sh launcher.py SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
